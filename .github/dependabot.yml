# Un PR semanal por ecosistema con lo menor y los parches juntos; las versiones
# mayores (React, Vite, TypeScript…) llegan cada una en su PR.
# Cada versión nueva espera 7 días antes de proponerse; los avisos de seguridad no esperan.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  # requirements.txt de Uploadrr-EMU fija sus dependencias directas: sus subidas llegan solo por estos PR.
  - package-ecosystem: pip
    directory: /uploadrr-emu
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uploadrr-emu:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
