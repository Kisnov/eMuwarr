name: Claude

# Claude responde cuando Kisnov lo menciona (@claude) en un issue o un PR.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] solo lo dispara Kisnov (if del job)
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: github.event.comment.user.login == 'Kisnov' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Una a una por issue o PR, y las menciones pendientes esperan su turno en vez de sustituirse.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
