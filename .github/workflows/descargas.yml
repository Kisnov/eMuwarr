# Cada día cuenta las descargas de la versión que lleva :latest en ghcr.io/kisnov/emuwarr y las deja en
# descargas.json de la rama insignias, de donde lee la insignia del README. GHCR no da esa cifra por API: la saca
# scripts/descargas_latest.py de la página de versiones del paquete. En un PR que toca esto solo la lee y la enseña.
name: Descargas

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/descargas.yml', 'scripts/descargas_latest.py']

permissions: {}

jobs:
  probar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/descargas_latest.py

  publicar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: descargas
      cancel-in-progress: false
    steps:
      # Las credenciales se quedan para el push a insignias; no se ejecuta nada que venga de fuera del repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
      - run: python3 scripts/descargas_latest.py --salida "$RUNNER_TEMP/descargas.json"
      # La rama insignias solo tiene descargas.json: un commit cuando cambia la cifra, ninguno si no.
      - run: |
          if git ls-remote --exit-code --heads origin insignias >/dev/null; then
            git fetch -q --depth 1 origin insignias
            git switch -q -C insignias FETCH_HEAD
          else
            git switch -q --orphan insignias
          fi
          cp "$RUNNER_TEMP/descargas.json" descargas.json
          git add descargas.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Descargas de :latest: $(jq -r .message descargas.json)"
          git push -q origin HEAD:insignias
