# Publica una versión: pasa los tests completos sobre la punta de dev, sube
# __version__ (en dev, y main avanza hasta ese commit: main es siempre la última versión),
# la etiqueta vX.Y.Z, construye la imagen (:X.Y.Z, :<sha>, :latest y :dev), publica el manifiesto en la rama version, que es lo que
# lee el aviso de actualización de la app, y crea el release con sus PR.
#
# A mano (Actions → Publicar versión → Run workflow), o solo los días impares del mes si desde
# la última versión se han fusionado al menos 3 PR de ramas feat/ o fix/. Con «solo prueba», y en
# cada push a dev que no sea solo de documentación, construye :dev de la punta de dev, sin tests, versión ni manifiesto.
# Igual en la rama multitracker (trabajo de Gabriel que aún no va a dev): construye :multitracker, y nunca publica una versión.
#
# Con «ref» (un commit de dev, una rama o una etiqueta) publica la versión de ESE commit: sin tests (la CI solo corre sobre
# la punta), con la versión y su etiqueta en la rama release/vX.Y.Z en vez de en dev (que ya avanzó; se fusiona después), sin
# mover main ni :dev, que sigue siendo la punta de dev. Si falla después de subir la versión, se reanuda con ref=release/vX.Y.Z.
name: Publicar versión

on:
  workflow_dispatch:
    inputs:
      escala:
        description: "auto: minor si hay algún feat desde la última versión, si no patch"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      notas:
        description: "Nota PÚBLICA del aviso, en neutro (vacía: «Correcciones y mejoras»)"
        type: string
        required: false
      solo_prueba:
        description: "Solo construir :dev, sin tests, versión ni manifiesto"
        type: boolean
        default: false
      ref:
        description: "Publicar la versión de este commit en vez de la punta de dev (sin tests; la versión va a release/vX.Y.Z)"
        type: string
        required: false
  push:
    branches: [dev, multitracker]
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "17 4 */2 * *"

permissions: {}

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  decidir:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/multitracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      accion: ${{ steps.d.outputs.accion }}
      escala: ${{ steps.d.outputs.escala }}
      commit: ${{ steps.c.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: c
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: d
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.ref_name }}
          ESCALA: ${{ inputs.escala || 'auto' }}
          PRUEBA: ${{ inputs.solo_prueba || false }}
          REF: ${{ inputs.ref }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
        run: |
          if [ "$PRUEBA" = true ] && [ -n "$REF" ]; then
            echo "::error::solo_prueba y ref no se combinan: :dev es la punta de dev."
            exit 1
          fi
          # El flujo ejecuta los scripts del commit elegido: uno que no publica el manifiesto en la rama version no sirve.
          if [ -n "$REF" ] && ! grep -q '^RAMA = "version"' scripts/publicar_version.py 2>/dev/null; then
            echo "::error::El commit de ref es demasiado antiguo: su scripts/publicar_version.py publica el manifiesto en un repo que ya no existe."
            exit 1
          fi
          if [ "$RAMA" = multitracker ] && [ "$PRUEBA" != true ] && [ "$EVENTO" != push ]; then
            echo "::error::Desde multitracker solo se construye :multitracker (solo_prueba); las versiones salen de dev."
            exit 1
          fi
          if [ "$PRUEBA" = true ] || [ "$EVENTO" = push ]; then
            echo "accion=prueba" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR fusionados desde el último commit que cambió la versión (también los de uploadrr-emu/): el merge
          # de una rama feat/ o fix/, o el commit feat:/fix: de un squash o un rebase.
          feat='Merge pull request #[0-9]+ from [^/]+/feat/|feat(\([^)]*\))?!?: '
          fix='Merge pull request #[0-9]+ from [^/]+/fix/|fix(\([^)]*\))?!?: '
          base="$(git log -1 --format=%H -G'^__version__' -- emuwarez_uploadrr/__init__.py)"
          prs="$(git log --first-parent --format=%s "$base"..HEAD | grep -E "^($feat|$fix)" || true)"
          n="$(printf '%s' "$prs" | grep -c . || true)"
          echo "$n PR feat/fix desde ${base:0:7}"
          if [ "$EVENTO" = schedule ] && [ "$n" -lt 3 ]; then
            echo "accion=nada" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ESCALA" != auto ]; then
            escala="$ESCALA"
          elif printf '%s\n' "$prs" | grep -qE "^($feat)"; then
            escala="minor"
          else
            escala="patch"
          fi
          # Antes de los tests y la imagen, lo que podría pararlo al final.
          python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS"
          echo "accion=publicar" >> "$GITHUB_OUTPUT"
          echo "escala=$escala" >> "$GITHUB_OUTPUT"

  tests:
    needs: decidir
    if: needs.decidir.outputs.accion == 'publicar' && inputs.ref == ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  imagen:
    needs: [decidir, tests]
    if: >-
      !cancelled() &&
      ((needs.decidir.outputs.accion == 'publicar' && (needs.tests.result == 'success' || (inputs.ref != '' && needs.tests.result == 'skipped'))) ||
       needs.decidir.outputs.accion == 'prueba')
    runs-on: ubuntu-latest
    timeout-minutes: 90  # arm64 va por emulación
    permissions:
      contents: write
      packages: write
    env:
      ACCION: ${{ needs.decidir.outputs.accion }}
      REF: ${{ inputs.ref }}
    steps:
      # Con credenciales: este job sube a dev y main (o a release/vX.Y.Z, con ref) el commit de la versión y su
      # etiqueta. .dockerignore excluye .git, así que no llegan a la imagen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && needs.decidir.outputs.commit || '' }}

      - id: version
        if: env.ACCION == 'publicar'
        env:
          ESCALA: ${{ needs.decidir.outputs.escala }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin dev
          # Re-ejecución de un intento que falló después de subir la versión: se completa esa, no otra, aunque
          # dev ya haya avanzado. La versión es el primer commit de dev sobre el que se lanzó este flujo.
          subida=""
          if [ -z "$REF" ]; then
            subida="$(git log --first-parent --reverse --format='%H %P %s' "$GITHUB_SHA"..origin/dev | head -n1 | grep -E "^[0-9a-f]{40} $GITHUB_SHA chore: versión " | cut -d' ' -f1)"
            # Una ejecución nueva lanzada sobre esa versión, que ya lleva su etiqueta: también se completa, no se sube otra.
            if [ -z "$subida" ] && git tag --points-at "$GITHUB_SHA" | grep -qx "v$(python3 scripts/subir_version.py --ver)"; then
              subida="$GITHUB_SHA"
            fi
          elif git log -1 --format=%s | grep -q '^chore: versión '; then
            # Reanudar una publicación con ref que falló tras subir la versión: ref=release/vX.Y.Z, que ya es la versión.
            subida="$(git rev-parse HEAD)"
          fi
          if [ -n "$subida" ]; then
            git checkout -q "$subida"
            echo "subida=true" >> "$GITHUB_OUTPUT"
            # Si el manifiesto ya la anuncia, estaba entera: reconstruir cambiaría el digest de :latest.
            publicado="$(gh api "repos/$GITHUB_REPOSITORY/contents/latest.json?ref=version" --jq .content | base64 -d | jq -r .commit)"
            if [ "$publicado" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::Esta versión ya estaba publicada entera; no se toca nada."
              echo "hecha=true" >> "$GITHUB_OUTPUT"
            else
              # Si ya hay una más nueva publicada, no se vuelve atrás moviendo :latest y :dev.
              python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
            fi
          else
            python3 scripts/subir_version.py "$ESCALA"
            # La versión nueva contra la publicada, antes de commit e imagen (p. ej. una más alta desde desplegar.sh).
            python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
            version="$(python3 scripts/subir_version.py --ver)"
            git commit -qam "chore: versión $version"
            git tag -a "v$version" -m "Versión $version"
          fi
          echo "version=$(python3 scripts/subir_version.py --ver)" >> "$GITHUB_OUTPUT"

      - id: sello
        if: steps.version.outputs.hecha != 'true'
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fecha=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "dia=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          # Una versión se construye solo con su sha; :X.Y.Z, :latest y :dev llegan cuando dev ya la tiene.
          imagen=ghcr.io/kisnov/emuwarr
          if [ "$ACCION" = publicar ]; then
            echo "tags=$imagen:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            # Una prueba lleva el nombre de su rama: :dev o :multitracker.
            echo "tags=$imagen:$RAMA" >> "$GITHUB_OUTPUT"
          fi

      # arm64 por emulación: el frontend se compila en la plataforma nativa (--platform=$BUILDPLATFORM en el Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.version.outputs.hecha != 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.hecha != 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.hecha != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        if: steps.version.outputs.hecha != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.sello.outputs.tags }}
          build-args: |
            APP_COMMIT=${{ steps.sello.outputs.commit }}
            APP_BUILD_DATE=${{ steps.sello.outputs.fecha }}
            APT_UPGRADE_DATE=${{ steps.sello.outputs.dia }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Con la imagen ya subida, y todo a la vez: si dev ha avanzado durante los tests (o main no es un
      # antecesor de la versión) se rechaza todo y no queda ninguna versión a medias.
      - if: env.ACCION == 'publicar' && steps.version.outputs.subida != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$REF" ]; then
            git push --atomic origin "HEAD:refs/heads/release/v$VERSION" "v$VERSION"
          else
            git push --atomic origin HEAD:dev HEAD:main "v$VERSION"
          fi

      - id: etiquetas
        if: env.ACCION == 'publicar' && steps.version.outputs.hecha != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.sello.outputs.commit }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Otra vez justo antes de mover las etiquetas: desde la primera comprobación pasó lo que tarda la imagen,
          # y pudo salir una versión más nueva (p. ej. con desplegar.sh). Así :latest y :dev no vuelven atrás.
          python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
          imagen=ghcr.io/kisnov/emuwarr
          # Con ref no se mueve :dev: sigue siendo la punta de dev.
          dev=(--tag "$imagen:dev"); [ -z "$REF" ] || dev=()
          docker buildx imagetools create --tag "$imagen:$VERSION" --tag "$imagen:latest" "${dev[@]}" "$imagen:$COMMIT"
          echo "digest=$(docker buildx imagetools inspect "$imagen:latest" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - if: env.ACCION == 'publicar' && steps.version.outputs.hecha != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.etiquetas.outputs.digest }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publicar_version.py --digest "$DIGEST" --notas "$NOTAS" --repo

      # Release con los PR fusionados desde la versión anterior. También al re-ejecutar una ya publicada.
      - if: env.ACCION == 'publicar'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
        shell: bash  # con pipefail: si falla la lista de etiquetas, no se crea con otra anterior
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          anterior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | sort -V | tail -1)"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Versión $VERSION" \
            --notes "$NOTAS" --generate-notes --notes-start-tag "$anterior"
