name: Trivy

# Busca vulnerabilidades conocidas en la imagen publicada (paquetes de Debian, de Python y binarios) y deja el resultado en
# Security → Code scanning, junto a CodeQL. Cada día: salen avisos nuevos aunque la imagen no cambie. Solo las que ya
# tienen arreglo (--ignore-unfixed), que son las que se resuelven reconstruyendo o subiendo una versión.
# Trivy va por su imagen oficial fijada por digest, no por trivy-action (cuyas etiquetas se secuestraron en 2026).
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        etiqueta: [latest, dev]
    steps:
      - env:
          ETIQUETA: ${{ matrix.etiqueta }}
        run: |
          docker run --rm -v "$RUNNER_TEMP:/out" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output "/out/trivy-$ETIQUETA.sarif" "ghcr.io/kisnov/emuwarr:$ETIQUETA"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy-${{ matrix.etiqueta }}.sarif
          category: trivy-${{ matrix.etiqueta }}
