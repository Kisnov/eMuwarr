# El total solo informa (su mínimo lo pone pytest en el CI); las líneas nuevas o cambiadas de emuwarez_uploadrr/ deben
# llevar tests. En uploadrr-emu/ el parche solo informa. El frontend no se mide.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 70%
        paths: ["emuwarez_uploadrr/"]
      uploadrr-emu:
        informational: true
        paths: ["uploadrr-emu/"]
# El job uploadrr-emu mide desde su carpeta: src/... es uploadrr-emu/src/...
fixes:
  - "^src/::uploadrr-emu/src/"
# Lo heredado de Uploadrr que no se mantiene (README de uploadrr-emu/): otros trackers, música y contenido adulto.
ignore:
  - uploadrr-emu/src/trackers/AITHER.py
  - uploadrr-emu/src/trackers/BLU.py
  - uploadrr-emu/src/trackers/HDB.py
  - uploadrr-emu/src/trackers/PTP.py
  - uploadrr-emu/src/metascraper.py
  - uploadrr-emu/src/databases/ptgen.py
  - uploadrr-emu/src/utils/cookieme.py
  - uploadrr-emu/src/musicprocessor.py
  - uploadrr-emu/src/databases/musicbrainz.py
  - uploadrr-emu/src/databases/discogs.py
  - uploadrr-emu/src/databases/deezer.py
  - uploadrr-emu/src/databases/porndb.py
  - uploadrr-emu/src/utils/phash.py
comment:
  layout: "diff, flags, files"
  require_changes: true
  require_bundle_changes: true
