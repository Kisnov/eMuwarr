[project]
name = "uploadrr"
version = "2.0.0"
description = "Prepara y sube películas y series a eMuwarez (UNIT3D). Derivado de Uploadrr y Upload-Assistant de L4G."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Lo heredado de Uploadrr fuera de la ruta de eMuwarez (README: «Solo se mantiene la ruta de eMuwarez») no cuenta en
# la cobertura: otros trackers, música, contenido adulto, la subida MANUAL, los cogs de Discord y lo que nadie importa.
# El informe que va a Codecov ya sale sin ellos, y el mínimo del CI (--cov-fail-under) se mide sobre el mismo conjunto.
[tool.coverage.run]
omit = [
    "src/trackers/AITHER.py",
    "src/trackers/BLU.py",
    "src/trackers/HDB.py",
    "src/trackers/PTP.py",
    "src/metascraper.py",
    "src/databases/ptgen.py",
    "src/utils/cookieme.py",
    "src/musicprocessor.py",
    "src/databases/musicbrainz.py",
    "src/databases/discogs.py",
    "src/databases/deezer.py",
    "src/databases/porndb.py",
    "src/utils/phash.py",
    "src/manual.py",
    "src/search.py",
    "src/vs.py",
    "src/utils/distmapper.py",
]

[tool.ruff]
line-length = 135
select = ["E", "W", "F", "I"]
target-version = "py39"

[tool.ruff.format]
skip-magic-trailing-comma = true
preview = true

indent-style = "space"
quote-style = "double"